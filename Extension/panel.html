<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komorebi</title><link rel="stylesheet" href="panel.css"></head><body>
<div class="panel">
<header><div class="brand"><span class="mark">k<span>✳</span></span><div><strong>komorebi</strong><small>読む、その先へ。</small></div></div><div class="header-actions"><button class="icon-button" id="settings" aria-label="AI接続設定" title="AI接続設定">⚙</button><button class="icon-button" id="close" aria-label="パネルを閉じる">×</button></div></header>
<div class="model-row"><span class="status-dot"></span><select id="provider" aria-label="AIモデル"><option value="local">Apple Intelligence</option><option value="openai">OpenAI</option><option value="anthropic">Claude</option><option value="gemini">Gemini</option><option value="custom">互換 API</option></select><span id="connection-label" class="badge">ON DEVICE</span></div>
<section class="source"><div class="source-top"><span class="eyebrow">READING NOW</span><button id="refresh" class="text-button">更新 ↻</button></div><div id="page-title" class="page-title">ページを読み込み中…</div><div id="page-domain" class="page-domain"></div><div class="scope-row"><select id="scope" aria-label="AIに送るページ情報"><option value="page">ページ本文を使う</option><option value="selection">選択範囲だけ使う</option><option value="none">ページを送らない</option></select><span id="context-size"></span></div><details><summary>参照するページ情報を確認</summary><pre id="context-preview"></pre></details></section>
<main id="conversation" aria-label="会話"><section id="welcome" class="welcome"><div class="sun">✳</div><div class="eyebrow">A LITTLE CLARITY</div><h1>気になることを、<br>ひとつずつ。</h1><p>要点をつかむ。言葉をほどく。<br>今読んでいるページから、理解を深めよう。</p><div class="quick-actions"><button data-prompt="このページの要点を3つにまとめ、最後にひとことで結論を書いてください。"><span>≡</span><div><strong>要点をつかむ</strong><small>ページを3つのポイントに</small></div><b>↗</b></button><button data-selection="true" data-prompt="選択した文章を、具体例を交えて初心者にもわかるように説明してください。"><span>⌁</span><div><strong>選んだ部分をひもとく</strong><small>気になった言葉をやさしく解説</small></div><b>↗</b></button><button data-prompt="このページの内容を学ぶための確認問題を3問作ってください。まず問題だけを出して、私の回答を待ってください。"><span>◇</span><div><strong>理解を確かめる</strong><small>3つの問いで学びを定着</small></div><b>↗</b></button></div></section><div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div></main>
<div id="notice" role="status" hidden></div>
<footer><div class="conversation-tools"><span id="privacy">このMacで処理されます</span><button id="clear" class="text-button">会話を消去</button><button id="export" class="text-button" aria-label="会話をMarkdownでコピー">コピー</button></div><form id="composer"><textarea id="question" maxlength="4000" rows="2" placeholder="このページについて聞いてみる…" aria-label="質問"></textarea><div class="composer-bottom"><span>⌘ + Enter で送信</span><button id="send" type="submit" aria-label="質問を送信">↑</button></div></form><div class="footnote">AIの回答は、元のページと照らし合わせてください。</div></footer>
</div><script src="shared.js"></script><script src="panel.js"></script></body></html>
